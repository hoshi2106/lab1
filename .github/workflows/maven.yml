name: Maven Build Test and Docker Push

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # JOB 1: Maven Build and Test
  maven:
    name: Maven Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile Maven Project
        run: mvn compile

      - name: Run JUnit Test Cases
        run: mvn test

      - name: Package Maven Project
        run: mvn package

  # JOB 2: Docker Build and Push
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: maven
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bank-app:latest
